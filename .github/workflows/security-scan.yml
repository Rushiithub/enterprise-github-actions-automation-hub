name: Security Scan

on:
  push:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Search for Passwords
        run: |
          echo "Running Security Scan..."
          grep -R "password" . || true

      - name: Security Status
        run: echo "Security Scan Completed"
